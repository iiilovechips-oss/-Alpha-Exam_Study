[project]
name = "canvas-sync"
version = "0.1.0"
description = "Pull class materials from Canvas into an organized local folder for NotebookLM and Claude."
requires-python = ">=3.11"
dependencies = [
    "markdownify>=1.2.3",
    "openpyxl>=3.1.5",
    "playwright>=1.45",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "python-dotenv>=1.0",
    "python-pptx>=1.0.2",
]

[project.scripts]
canvas-sync = "canvas_sync.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
