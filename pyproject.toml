[project]
name = "exam-study"
version = "0.1.0"
description = "Pulls class materials from Canvas, explains each lecture slide in plain words, and tests your understanding."
requires-python = ">=3.11"
dependencies = [
    "markdownify>=1.2.3",
    "openpyxl>=3.1.5",
    "playwright>=1.45",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "python-dotenv>=1.0",
    "python-pptx>=1.0.2",
]

[project.scripts]
exam-study = "exam_study.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
